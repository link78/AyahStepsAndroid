name: Android Build

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v1
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      id: gradle-cache
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Display cache status
      run: |
        if [ "${{ steps.gradle-cache.outputs.cache-hit }}" == "true" ]; then
          echo "✓ Gradle cache restored successfully"
        else
          echo "ℹ Building with fresh Gradle cache"
        fi
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Display build environment
      run: |
        echo "Java version:"
        java -version
        echo "Gradle version:"
        ./gradlew --version
        echo "Environment variables:"
        env | grep -E 'JAVA|ANDROID|GRADLE' || true
      
    - name: Check network connectivity
      run: |
        echo "Checking connectivity to repositories..."
        curl -I https://dl.google.com/dl/android/maven2/ || echo "Google Maven unavailable"
        curl -I https://repo.maven.apache.org/maven2/ || echo "Maven Central unavailable"
      continue-on-error: true
      
    - name: Download dependencies
      run: ./gradlew dependencies --no-daemon --refresh-dependencies
      continue-on-error: true
      
    - name: Run Gradle build
      run: ./gradlew build --stacktrace --info --no-daemon
      
    - name: Run unit tests
      run: ./gradlew test --stacktrace --info --no-daemon
      continue-on-error: true
      
    - name: Run lint checks
      run: ./gradlew lint --stacktrace --info --no-daemon
      continue-on-error: true
      
    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace --info --no-daemon
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
        
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          app/build/test-results/
          app/build/reports/tests/
        retention-days: 7
        
    - name: Upload Lint Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-results
        path: |
          app/build/reports/lint-results-*.html
          app/build/reports/lint-results-*.xml
        retention-days: 7
        
    - name: Upload build reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports
        path: |
          app/build/reports/
          build/reports/
        retention-days: 7
